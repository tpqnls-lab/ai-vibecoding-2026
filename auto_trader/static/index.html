<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI 주식 트레이더</title><link rel="stylesheet" href="/static/styles.css?v=45"></head><body><main><header class="topbar"><div class="brand"><span class="brand-mark">T</span><div><strong>AI 주식 트레이더</strong><small>모의 투자 공간</small></div></div><span id="connection" class="status"><i></i> 실시간 연결</span></header><section class="hero"><div><p class="eyebrow">내 투자 현황</p><h1>안녕하세요, 투자자님</h1><p class="muted">AI가 분석한 추천 종목을 확인하고 매매해보세요.</p></div><div class="mode"><span>운영 모드</span><b id="mode">PAPER</b></div></section><section class="stats"><article><span>매매 가능 금액</span><strong id="cash">₩10,000,000</strong><small>가상계좌 잔액</small></article><article><span>AI 추천 예산</span><strong id="budget-amount">₩4,000,000</strong><small><input id="budget-percent" type="number" min="1" max="100" value="40"> % <button id="budget-apply" class="mini-btn">적용</button></small></article><article><span>보유 종목</span><strong id="positions">0개</strong><small id="pnl">실현 손익 ₩0</small></article></section><section class="recommend-head"><div><h2>AI 추천 후보 <em>TOP 5</em></h2><p class="muted">오늘의 추천 후보입니다.</p></div><button type="button" class="ghost" id="refresh-recommendations" onclick="window.refreshRecommendations(window.stocks.map(x=>x.symbol).join(&#39;,&#39;))">다른 후보 추천</button><button class="green-btn" id="auto-btn">자동매매 시작</button></section><div id="cards" class="stock-grid"></div><section class="holdings card"><div class="section-title"><h2>내 보유종목</h2><span class="muted">현재가·손익 실시간 반영</span></div><div id="holdings-list" class="empty">보유한 종목이 없습니다.</div></section><section id="workspace" class="workspace hidden"><div class="chart-panel"><div class="detail-title"><div><span class="rank">#1</span><h2 id="detail-name">종목</h2><span id="detail-symbol" class="muted">000000</span></div><div class="quote"><strong id="detail-price">₩0</strong><span id="detail-change">+0.00%</span></div></div><div class="periods"><button class="active" data-period="5m">5분봉</button><button data-period="30m">30분봉</button><button data-period="1h">1시간봉</button><button data-period="1d">일봉</button><button data-period="1mo">월봉</button><button data-period="1y">년봉</button></div><div class="chart-wrap"><svg id="chart" viewBox="0 0 760 330"></svg></div></div><aside class="order-panel"><div class="order-tabs"><button class="active buy" data-side="BUY">매수</button><button data-side="SELL">매도</button></div><label>주문 수량<input id="quantity" type="number" min="1" value="1"></label><div class="order-total"><span>주문 금액</span><b id="order-total">₩0</b></div><button id="order-btn" class="order-submit buy">매수하기</button><p id="order-message" class="order-message"></p></aside></section><section class="orders card"><div class="section-title"><h2>최근 주문</h2><span class="muted">모의 체결 내역</span></div><div id="orders-list" class="empty">아직 주문 내역이 없습니다.</div></section></main><script src="/static/app.js?v=45"></script><script src="/static/chart-tools.js?v=45"></script><script src="/static/auto-trading.js?v=45"></script></body></html>
